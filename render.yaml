services:
  - type: web
    name: ics-fullstack-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build && npm run db && npm run seed
    startCommand: npm start
    healthCheckPath: /api/regions
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: ics-data
      mountPath: /var/data
      sizeGB: 1
